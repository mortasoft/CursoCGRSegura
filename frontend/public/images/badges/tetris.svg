<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradiente_tetris" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8e2de2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a00e0;stop-opacity:1" />
    </linearGradient>

    <filter id="sombra_suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Hexagonal -->
  <path d="M250 30 L450 140 L450 360 L250 470 L50 360 L50 140 Z"
        fill="url(#gradiente_tetris)"
        stroke="#b388ff"
        stroke-width="8"
        filter="url(#sombra_suave)"/>

  <!-- Contorno Interior -->
  <path d="M250 50 L430 155 L430 345 L250 450 L70 345 L70 155 Z"
        fill="none"
        stroke="#d1c4e9"
        stroke-width="4"
        opacity="0.7"/>

  <!-- Laterales Decorativos -->
  <path d="M50 160 C 10 180 10 320 50 340 L 50 160 Z"
        fill="#7c4dff"
        opacity="0.8"/>

  <path d="M450 160 C 490 180 490 320 450 340 L 450 160 Z"
        fill="#7c4dff"
        opacity="0.8"/>

  <!-- Pieza Tetris -->
  <g transform="translate(140,140)">

    <!-- Bloques -->
    <rect x="0" y="80" width="70" height="70" rx="10" fill="#00e5ff" stroke="white" stroke-width="5"/>
    <rect x="70" y="80" width="70" height="70" rx="10" fill="#00e5ff" stroke="white" stroke-width="5"/>
    <rect x="140" y="80" width="70" height="70" rx="10" fill="#00e5ff" stroke="white" stroke-width="5"/>
    <rect x="140" y="10" width="70" height="70" rx="10" fill="#00e5ff" stroke="white" stroke-width="5"/>

    <!-- Brillos -->
    <rect x="10" y="90" width="20" height="20" rx="5" fill="white" opacity="0.35"/>
    <rect x="80" y="90" width="20" height="20" rx="5" fill="white" opacity="0.35"/>
    <rect x="150" y="90" width="20" height="20" rx="5" fill="white" opacity="0.35"/>
    <rect x="150" y="20" width="20" height="20" rx="5" fill="white" opacity="0.35"/>

    <!-- Líneas decorativas -->
    <path d="M-30 40 L-5 55" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M240 40 L265 55" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M-30 180 L-5 165" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <path d="M240 180 L265 165" stroke="white" stroke-width="4" stroke-linecap="round"/>

  </g>
</svg>
