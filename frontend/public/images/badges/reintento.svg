<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradiente_retry" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff5722;stop-opacity:1" />
    </linearGradient>

    <filter id="sombra_suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Hexagonal -->
  <path d="M250 30 L450 140 L450 360 L250 470 L50 360 L50 140 Z"
        fill="url(#gradiente_retry)"
        stroke="#ffcc80"
        stroke-width="8"
        filter="url(#sombra_suave)"/>

  <!-- Contorno Interior -->
  <path d="M250 50 L430 155 L430 345 L250 450 L70 345 L70 155 Z"
        fill="none"
        stroke="#ffe0b2"
        stroke-width="4"
        opacity="0.7"/>

  <!-- Laterales Decorativos -->
  <path d="M50 160 C 10 180 10 320 50 340 L 50 160 Z"
        fill="#ff7043"
        opacity="0.8"/>

  <path d="M450 160 C 490 180 490 320 450 340 L 450 160 Z"
        fill="#ff7043"
        opacity="0.8"/>

  <!-- Icono Reintento -->
  <g transform="translate(110,110)">

    <!-- Flecha circular -->
    <path d="M180 40
             A110 110 0 1 1 85 250"
          fill="none"
          stroke="white"
          stroke-width="24"
          stroke-linecap="round"/>

    <!-- Punta flecha -->
    <path d="M70 210 L70 280 L135 245 Z"
          fill="white"/>

    <!-- Centro -->
    <circle cx="180" cy="180" r="45"
            fill="#fff3e0"
            stroke="white"
            stroke-width="8"/>

    <!-- Símbolo de retry -->
    <path d="M165 180 L180 165 L195 180
             M180 165 L180 200"
          fill="none"
          stroke="#ff5722"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Efectos -->
    <circle cx="85" cy="85" r="8" fill="white" opacity="0.6"/>
    <circle cx="280" cy="120" r="6" fill="white" opacity="0.5"/>
    <circle cx="250" cy="280" r="10" fill="white" opacity="0.4"/>

  </g>
</svg>
