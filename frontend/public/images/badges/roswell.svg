<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradiente_verde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff99;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003311;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradiente_rayo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffcc;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00ff99;stop-opacity:0.0" />
    </linearGradient>
    <filter id="brillo_neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Hexagonal Shield Background -->
  <path d="M250 30 L450 140 L450 360 L250 470 L50 360 L50 140 Z" fill="url(#gradiente_verde)" stroke="#00ffcc" stroke-width="8" filter="url(#brillo_neon)"/>
  
  <!-- Inner Border -->
  <path d="M250 50 L430 155 L430 345 L250 450 L70 345 L70 155 Z" fill="none" stroke="#00ff99" stroke-width="4" opacity="0.6"/>

  <!-- Left/Right Side Wing Accents -->
  <path d="M50 160 C 10 180 10 320 50 340 L 50 160 Z" fill="#00ffcc" opacity="0.8"/>
  <path d="M450 160 C 490 180 490 320 450 340 L 450 160 Z" fill="#00ffcc" opacity="0.8"/>

  <!-- Tractor Beam -->
  <path d="M220 230 L100 420 L400 420 L280 230 Z" fill="url(#gradiente_rayo)" />

  <!-- UFO Flying Saucer Group -->
  <g fill="white" transform="translate(0, 0)">
    <!-- Cabin Dome -->
    <path d="M180 200 C180 130 320 130 320 200 Z" fill="#b3fff0" opacity="0.9" />
    
    <!-- Alien Silhouette inside cabin -->
    <path d="M240 185 C230 185 225 170 235 155 C240 145 260 145 265 155 C275 170 270 185 260 185 Z" fill="#003311" />
    <ellipse cx="245" cy="165" rx="5" ry="8" fill="#00ff99" transform="rotate(-15, 245, 165)" />
    <ellipse cx="255" cy="165" rx="5" ry="8" fill="#00ff99" transform="rotate(15, 255, 165)" />

    <!-- Saucer Outer Rim -->
    <path d="M120 210 C120 180 380 180 380 210 C380 240 120 240 120 210 Z" fill="#00ffcc" stroke="#003311" stroke-width="3" />
    <!-- Saucer Underbelly -->
    <path d="M140 210 C140 235 360 235 360 210 Z" fill="#00b386" />

    <!-- Glowing lights on the rim -->
    <circle cx="160" cy="210" r="8" fill="#ffffff" />
    <circle cx="205" cy="215" r="8" fill="#ffffff" />
    <circle cx="250" cy="217" r="8" fill="#ffffff" />
    <circle cx="295" cy="215" r="8" fill="#ffffff" />
    <circle cx="340" cy="210" r="8" fill="#ffffff" />
  </g>

  <!-- Hacker/Terminal symbols overlay (Matrix-like rain bits) -->
  <g stroke="#00ffcc" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="120" y1="280" x2="120" y2="300" />
    <line x1="150" y1="310" x2="150" y2="340" />
    <line x1="350" y1="280" x2="350" y2="310" />
    <line x1="380" y1="320" x2="380" y2="335" />
    
    <!-- Code Bracket symbols in bottom corners -->
    <path d="M 120 370 L 100 370 L 100 410 L 120 410" fill="none" stroke="#00ffcc" stroke-width="4" />
    <path d="M 380 370 L 400 370 L 400 410 L 380 410" fill="none" stroke="#00ffcc" stroke-width="4" />
  </g>
</svg>
