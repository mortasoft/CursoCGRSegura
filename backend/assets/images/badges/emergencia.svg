<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradiente_emergencia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1e3d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#050e21;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradiente_borde" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="gradiente_sirena" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff3b30;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c60814;stop-opacity:1" />
    </linearGradient>

    <filter id="sombra_suave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <clipPath id="base-clip">
      <path d="M 175 340 H 325 C 335 340, 345 350, 345 360 L 340 375 C 338 381, 332 385, 325 385 H 175 C 168 385, 162 381, 160 375 L 155 360 C 155 350, 165 340, 175 340 Z"/>
    </clipPath>
  </defs>

  <!-- Side Ears -->
  <path d="M50 160 C 10 180 10 320 50 340 L 50 160 Z"
        fill="#3a86c8"
        opacity="0.8"/>

  <path d="M450 160 C 490 180 490 320 450 340 L 450 160 Z"
        fill="#3a86c8"
        opacity="0.8"/>

  <!-- Outer Hexagon -->
  <path d="M250 30 L450 140 L450 360 L250 470 L50 360 L50 140 Z"
        fill="url(#gradiente_emergencia)"
        stroke="url(#gradiente_borde)"
        stroke-width="8"
        filter="url(#sombra_suave)"/>

  <!-- Inner border (contorno) -->
  <path d="M250 50 L430 155 L430 345 L250 450 L70 345 L70 155 Z"
        fill="none"
        stroke="#80d8ff"
        stroke-width="4"
        opacity="0.6"/>

  <!-- Siren Graphics Group -->
  <g transform="translate(0, 0)">
    <!-- 1. Flashing Rays Glow (behind siren) -->
    <!-- Left Rays Glow -->
    <line x1="155" y1="165" x2="195" y2="200" stroke="#f1c40f" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
    <line x1="140" y1="230" x2="185" y2="230" stroke="#f1c40f" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
    <line x1="155" y1="295" x2="195" y2="260" stroke="#f1c40f" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
    <!-- Right Rays Glow -->
    <line x1="345" y1="165" x2="305" y2="200" stroke="#f1c40f" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
    <line x1="360" y1="230" x2="315" y2="230" stroke="#f1c40f" stroke-width="14" stroke-linecap="round" opacity="0.25"/>
    <line x1="345" y1="295" x2="305" y2="260" stroke="#f1c40f" stroke-width="14" stroke-linecap="round" opacity="0.25"/>

    <!-- 2. Flashing Rays Main -->
    <!-- Left Rays -->
    <line x1="155" y1="165" x2="195" y2="200" stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="230" x2="185" y2="230" stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>
    <line x1="155" y1="295" x2="195" y2="260" stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>
    <!-- Right Rays -->
    <line x1="345" y1="165" x2="305" y2="200" stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>
    <line x1="360" y1="230" x2="315" y2="230" stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>
    <line x1="345" y1="295" x2="305" y2="260" stroke="#ffd54f" stroke-width="6" stroke-linecap="round"/>

    <!-- 3. Caution Striped Base -->
    <g clip-path="url(#base-clip)">
      <rect x="140" y="330" width="220" height="60" fill="#f1c40f"/>
      <line x1="130" y1="395" x2="190" y2="330" stroke="#2c3e50" stroke-width="18"/>
      <line x1="170" y1="395" x2="230" y2="330" stroke="#2c3e50" stroke-width="18"/>
      <line x1="210" y1="395" x2="270" y2="330" stroke="#2c3e50" stroke-width="18"/>
      <line x1="250" y1="395" x2="310" y2="330" stroke="#2c3e50" stroke-width="18"/>
      <line x1="290" y1="395" x2="350" y2="330" stroke="#2c3e50" stroke-width="18"/>
      <line x1="330" y1="395" x2="390" y2="330" stroke="#2c3e50" stroke-width="18"/>
    </g>
    <!-- Border line for caution base -->
    <path d="M 175 340 H 325 C 335 340, 345 350, 345 360 L 340 375 C 338 381, 332 385, 325 385 H 175 C 168 385, 162 381, 160 375 L 155 360 C 155 350, 165 340, 175 340 Z"
          fill="none" stroke="#2c3e50" stroke-width="3"/>

    <!-- 4. White base bar -->
    <rect x="175" y="318" width="150" height="24" rx="12" fill="#ffffff" stroke="#2c3e50" stroke-width="4"/>

    <!-- 5. Red Siren Dome -->
    <path d="M 215 190 H 285 C 300 190, 310 205, 310 220 L 315 318 H 185 L 190 220 C 190 205, 200 190, 215 190 Z"
          fill="url(#gradiente_sirena)" stroke="#2c3e50" stroke-width="4" stroke-linejoin="round"/>

    <!-- Dome reflection gloss -->
    <path d="M 212 196 A 12 12 0 0 0 196 215 L 191 285 C 191 292 195 295 199 293 L 202 230 C 202 210, 210 202, 220 199 Z"
          fill="white" opacity="0.3"/>

    <!-- 6. Golden Internal Reflector -->
    <!-- Post -->
    <rect x="246" y="215" width="8" height="85" rx="4" fill="#d35400" stroke="#2c3e50" stroke-width="2"/>
    <!-- Bow tie / Reflector flares -->
    <path d="M 246 257 L 218 242 L 218 272 Z" fill="#ffd54f" stroke="#2c3e50" stroke-width="2" stroke-linejoin="round"/>
    <path d="M 254 257 L 282 242 L 282 272 Z" fill="#ffd54f" stroke="#2c3e50" stroke-width="2" stroke-linejoin="round"/>
    <!-- Center circle -->
    <circle cx="250" cy="257" r="10" fill="#ffd54f" stroke="#2c3e50" stroke-width="2"/>
  </g>
</svg>